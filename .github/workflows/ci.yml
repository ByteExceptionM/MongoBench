name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: typecheck / lint / format / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

  package:
    name: package (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: mongobench-windows
          - os: ubuntu-latest
            target: linux
            artifact: mongobench-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `electron-vite build` emits the bundles into `out/`; electron-builder
      # then packages them into a portable .exe (Windows) or AppImage + tar.gz
      # (Linux). No code signing — artifacts are for direct download.
      - name: Build distributable
        run: npm run dist:${{ matrix.target }}
        env:
          GH_TOKEN: ''

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
